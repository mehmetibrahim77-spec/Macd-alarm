name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: MACD Top 100 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          BINANCE = "https://api.binance.com"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              response = requests.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )
              print("Telegram:", response.status_code)

          # TOP 100 USDT COIN
          data = requests.get(
              f"{BINANCE}/api/v3/ticker/24hr",
              timeout=20
          ).json()

          coins = []

          for item in data:
              symbol = item["symbol"]

              if not symbol.endswith("USDT"):
                  continue

              if any(x in symbol for x in [
                  "UPUSDT",
                  "DOWNUSDT",
                  "BULLUSDT",
                  "BEARUSDT"
              ]):
                  continue

              try:
                  volume = float(item["quoteVolume"])
                  coins.append((symbol, volume))
              except:
                  pass

          coins.sort(
              key=lambda x: x[1],
              reverse=True
          )

          symbols = [x[0] for x in coins[:100]]

          print(f"Top 100 taranıyor: {len(symbols)} coin")

          # HER COIN
          for symbol in symbols:

              try:

                  response = requests.get(
                      f"{BINANCE}/api/v3/klines",
                      params={
                          "symbol": symbol,
                          "interval": "4h",
                          "limit": 100
                      },
                      timeout=20
                  )

                  klines = response.json()

                  if not isinstance(klines, list):
                      continue

                  if len(klines) < 35:
                      continue

                  closes = pd.Series(
                      [float(k[4]) for k in klines]
                  )

                  # MACD 12 / 26
                  ema12 = closes.ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = closes.ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  # SIGNAL 9
                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  # HISTOGRAM
                  histogram = macd - signal

                  # SON KAPANMIŞ 4H MUM
                  previous = histogram.iloc[-3]
                  current = histogram.iloc[-2]

                  price = closes.iloc[-2]

                  alarm = None

                  # 🔴 → 🟢 = AL
                  if previous < 0 and current >= 0:
                      alarm = "AL 🟢"

                  # 🟢 → 🔴 = SAT
                  elif previous >= 0 and current < 0:
                      alarm = "SAT 🔴"

                  if alarm:

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          f"Sinyal: {alarm}\n"
                          f"Fiyat: {price:.8f}\n\n"
                          f"Histogram: {previous:.8f} → {current:.8f}"
                      )

                      print(message)

                      send_telegram(message)

                      time.sleep(1)

              except Exception as e:

                  print(f"{symbol} hata: {e}")

          print("MACD Top 100 - 4H taraması tamamlandı.")

          PY
