name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Top 100 - 4H MACD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          BASE = "https://api.bybit.com"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def bybit_get(endpoint, params):

              r = session.get(
                  BASE + endpoint,
                  params=params,
                  timeout=20
              )

              print(
                  f"{endpoint} -> {r.status_code}"
              )

              r.raise_for_status()

              data = r.json()

              if data.get("retCode") != 0:
                  raise RuntimeError(
                      f"Bybit: {data}"
                  )

              return data["result"]

          def telegram(message):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TOKEN}/sendMessage"
              )

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print(
                  "Telegram:",
                  r.status_code
              )

          # ==========================================
          # TOP 100 USDT
          # ==========================================

          result = bybit_get(
              "/v5/market/tickers",
              {
                  "category": "linear"
              }
          )

          tickers = result["list"]

          coins = []

          for item in tickers:

              symbol = item.get("symbol", "")

              # Sadece USDT perpetual
              if not symbol.endswith("USDT"):
                  continue

              try:
                  turnover = float(
                      item["turnover24h"]
                  )
              except:
                  continue

              coins.append(
                  (symbol, turnover)
              )

          # 24 saatlik işlem hacmine göre sırala
          coins.sort(
              key=lambda x: x[1],
              reverse=True
          )

          symbols = [
              x[0]
              for x in coins[:100]
          ]

          print(
              f"TOP 100 bulundu: {len(symbols)}"
          )

          # ==========================================
          # 4H MACD 12 / 26 / 9
          # ==========================================

          for symbol in symbols:

              try:

                  result = bybit_get(
                      "/v5/market/kline",
                      {
                          "category": "linear",
                          "symbol": symbol,
                          "interval": "240",
                          "limit": "100"
                      }
                  )

                  rows = result["list"]

                  if len(rows) < 40:
                      continue

                  # Bybit en yeni mumu ilk sırada döndürür.
                  rows = sorted(
                      rows,
                      key=lambda x: int(x[0])
                  )

                  # Son mum açık olabilir.
                  # Onu tamamen çıkarıyoruz.
                  closed = rows[:-1]

                  closes = pd.Series([
                      float(row[4])
                      for row in closed
                  ])

                  if len(closes) < 35:
                      continue

                  # MACD 12 / 26
                  ema12 = closes.ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = closes.ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  # Signal 9
                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  # Histogram
                  hist = macd - signal

                  # Son 3 KAPANMIŞ mum
                  h1 = hist.iloc[-3]
                  h2 = hist.iloc[-2]
                  h3 = hist.iloc[-1]

                  price = closes
