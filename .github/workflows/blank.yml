name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd
          import time

          BYBIT = "https://api.bybit.com"
          CMC = "https://pro-api.coinmarketcap.com/public-api"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MACD-Alarm/1.0",
              "Accept": "application/json"
          })

          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              r.raise_for_status()

          # ============================================================
          # CMC TOP 200 MARKET CAP
          # ============================================================

          def get_cmc_top_200():
              url = f"{CMC}/v1/cryptocurrency/listings/latest"

              params = {
                  "start": 1,
                  "limit": 200,
                  "convert": "USD",
                  "sort": "market_cap"
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=30
              )

              r.raise_for_status()

              data = r.json()

              if "data" not in data:
                  raise RuntimeError(
                      f"CMC cevap hatası: {data}"
                  )

              return data["data"]

          # ============================================================
          # BYBIT LINEAR CONTRACTS
          # ============================================================

          def get_bybit_symbols():
              url = f"{BYBIT}/v5/market/instruments-info"

              cursor = None
              symbols = {}

              while True:

                  params = {
                      "category": "linear",
                      "limit": 1000
                  }

                  if cursor:
                      params["cursor"] = cursor

                  r = session.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  r.raise_for_status()

                  data = r.json()

                  if data.get("retCode") != 0:
                      raise RuntimeError(
                          f"Bybit instruments hatası: {data}"
                      )

                  result = data["result"]

                  for item in result.get("list", []):

                      symbol = item.get("symbol", "")
                      status = item.get("status", "")
                      contract_type = item.get("contractType", "")

                      if (
                          symbol.endswith("USDT")
                          and status == "Trading"
                          and contract_type == "LinearPerpetual"
                      ):
                          base_coin = item.get(
                              "baseCoin",
                              ""
                          ).upper()

                          if base_coin:
                              symbols[base_coin] = symbol

                  cursor = result.get("nextPageCursor")

                  if not cursor:
                      break

              return symbols

          # ============================================================
          # BYBIT 4H KLINES
          # ============================================================

          def get_klines(symbol):

              url = f"{BYBIT}/v5/market/kline"

              params = {
                  "category": "linear",
                  "symbol": symbol,
                  "interval": "240",
                  "limit": 100
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=20
              )

              r.raise_for_status()

              data = r.json()

              if data.get("retCode") != 0:
                  raise RuntimeError(
                      f"Kline hatası: {data}"
                  )

              rows = data["result"]["list"]

              if len(rows) < 40:
                  return None

              # Bybit en yeni mumu ilk sırada verir.
              rows = sorted(
                  rows,
                  key=lambda x: int(x[0])
              )

              # Son mum açık olabilir.
              # Açık 4H mumu kesinlikle kullanma.
              rows = rows[:-1]

              closes = [
                  float(row[4])
                  for row in rows
              ]

              return closes

          # ============================================================
          # MACD 12 / 26 / 9
          # ============================================================

          def check_macd(closes):

              if len(closes) < 35:
                  return None

              close = pd.Series(closes)

              ema12 = close.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = close.ewm(
                  span=26,
                  adjust=False
              ).mean()

              macd = ema12 - ema26

              signal = macd.ewm(
                  span=9,
                  adjust=False
              ).mean()

              # Son iki KAPANMIŞ 4H mum
              prev_macd = float(macd.iloc[-2])
              prev_signal = float(signal.iloc[-2])

              curr_macd = float(macd.iloc[-1])
              curr_signal = float(signal.iloc[-1])

              price = float(close.iloc[-1])

              # MACD signal çizgisini aşağıdan yukarı kesiyor
              if (
                  prev_macd <= prev_signal
                  and curr_macd > curr_signal
              ):
                  return "AL", price

              # MACD signal çizgisini yukarıdan aşağı kesiyor
              if (
                  prev_macd >= prev_signal
                  and curr_macd < curr_signal
              ):
                  return "SAT", price

              return None

