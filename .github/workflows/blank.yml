name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

          python <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          CMC = "https://pro-api.coinmarketcap.com/public-api"
          BINANCE = "https://fapi.binance.com"

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          if not TOKEN:
              raise RuntimeError("TELEGRAM_BOT_TOKEN secret bulunamadı.")

          if not CHAT_ID:
              raise RuntimeError("TELEGRAM_CHAT_ID secret bulunamadı.")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MACD-Alarm/1.0",
              "Accept": "application/json"
          })


          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              if not r.ok:
                  raise RuntimeError(
                      f"Telegram HTTP {r.status_code}: {r.text[:500]}"
                  )

              data = r.json()

              if not data.get("ok"):
                  raise RuntimeError(
                      f"Telegram API hatası: {data}"
                  )


          # ============================================================
          # COINMARKETCAP - MARKET CAP TOP 200
          # ============================================================

          def get_cmc_top_200():

              url = f"{CMC}/v3/cryptocurrency/listings/latest"

              params = {
                  "start": 1,
                  "limit": 200,
                  "convert": "USD",
                  "sort": "market_cap"
              }

              print("CMC Top 200 market-cap isteniyor...")

              r = session.get(
                  url,
                  params=params,
                  timeout=30
              )

              print(f"CMC HTTP: {r.status_code}")

              if not r.ok:
                  raise RuntimeError(
                      f"CMC HTTP {r.status_code}: {r.text[:1000]}"
                  )

              data = r.json()

              if "data" not in data:
                  raise RuntimeError(
                      f"CMC cevapta data yok: {data}"
                  )

              coins = data["data"]

              if not coins:
                  raise RuntimeError(
                      "CMC Top 200 boş geldi."
                  )

              print(
                  f"CMC Top 200 başarıyla alındı: {len(coins)} coin"
              )

              return coins


          # ============================================================
          # BINANCE USDⓈ-M FUTURES
          # ============================================================

          def get_binance_symbols():

              url = f"{BINANCE}/fapi/v1/exchangeInfo"

              r = session.get(
                  url,
                  timeout=30
              )

              print(
                  f"Binance exchangeInfo HTTP: {r.status_code}"
              )

              if not r.ok:
                  raise RuntimeError(
                      f"Binance exchangeInfo HTTP "
                      f"{r.status_code}: {r.text[:1000]}"
                  )

              data = r.json()

              symbols = {}

              for item in data.get("symbols", []):

                  symbol = item.get("symbol", "")
                  status = item.get("status", "")
                  contract_type = item.get("contractType", "")
                  quote_asset = item.get("quoteAsset", "")
                  base_asset = item.get("baseAsset", "")

                  if (
                      status == "TRADING"
                      and contract_type == "PERPETUAL"
                      and quote_asset == "USDT"
                      and base_asset
                  ):
                      symbols[base_asset.upper()] = symbol


              print(
                  f"Binance USDT perpetual sayısı: {len(symbols)}"
              )

              return symbols


          # ============================================================
          # BINANCE 4H KLINE
          # ============================================================

          def get_klines(symbol):

              url = f"{BINANCE}/fapi/v1/klines"

              params = {
                  "symbol": symbol,
                  "interval": "4h",
                  "limit": 100
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=20
              )

              if not r.ok:
                  raise RuntimeError(
                      f"{symbol} kline HTTP "
                      f"{r.status_code}: {r.text[:500]}"
                  )

              rows = r.json()

              if not isinstance(rows, list):
                  raise RuntimeError(
                      f"{symbol} kline beklenmeyen cevap: {rows}"
                  )

              if len(rows) < 40:
                  print(
                      f"{symbol}: yeterli mum yok ({len(rows)})"
                  )
                  return None

