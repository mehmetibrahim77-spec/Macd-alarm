name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          def top_200():
              r = requests.get(
                  "https://api.coingecko.com/api/v3/coins/markets",
                  params={
                      "vs_currency": "usd",
                      "order": "market_cap_desc",
                      "per_page": 200,
                      "page": 1,
                      "sparkline": "false"
                  },
                  timeout=30
              )
              r.raise_for_status()
              return [x["symbol"].upper() for x in r.json()]

          def bybit_symbols():
              r = requests.get(
                  "https://api.bybit.com/v5/market/instruments-info",
                  params={
                      "category": "linear",
                      "status": "Trading",
                      "limit": 1000
                  },
                  timeout=30
              )
              r.raise_for_status()
              data = r.json()

              if data.get("retCode") != 0:
                  raise Exception(data)

              return {
                  x["symbol"]
                  for x in data["result"]["list"]
                  if x.get("status") == "Trading"
                  and x.get("contractType") == "LinearPerpetual"
                  and x.get("quoteCoin") == "USDT"
              }

          def candles(symbol):
              r = requests.get(
                  "https://api.bybit.com/v5/market/kline",
                  params={
                      "category": "linear",
                      "symbol": symbol,
                      "interval": "240",
                      "limit": 100
                  },
                  timeout=30
              )
              r.raise_for_status()
              data = r.json()

              if data.get("retCode") != 0:
                  return None

              rows = sorted(
                  data["result"]["list"],
                  key=lambda x: int(x[0])
              )

              now = int(time.time() * 1000)
              closed = []

              for row in rows:
                  start = int(row[0])
                  close = start + 14400000
                  if close <= now:
                      closed.append(row)

              return closed if len(closed) >= 35 else None

          def macd(rows):
              close = pd.Series(
                  [float(x[4]) for x in rows]
              )

              ema12 = close.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = close.ewm(
                  span=26,
                  adjust=False
              ).mean()

              m = ema12 - ema26

              s = m.ewm(
                  span=9,
                  adjust=False
              ).mean()

              h = m - s

              previous = float(h.iloc[-2])
              current = float(h.iloc[-1])

              if previous <= 0 and current > 0:
                  return "AL", current

              if previous >= 0 and current < 0:
                  return "SAT", current

              return None, current

          def telegram(message):
              r = requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )
              r.raise_for_status()

          print("MACD 4H taramasi basliyor...")

          coins = top_200()
          symbols = bybit_symbols()

          print("Top 200:", len(coins))
          print("Bybit perpetual:", len(symbols))

          signals = []

          for coin in coins:
              symbol = coin + "USDT"

              if symbol not in symbols:
                  continue

              try:
                  rows = candles(symbol)

                  if rows is None:
                      continue

                  signal, histogram = macd(rows)

                  print(
                      symbol,
                      "Histogram:",
                      round(histogram, 8),
                      "Sinyal:",
                      signal
                  )

                  if signal:
                      price = float(rows[-1][4])
                      signals.append(
                          (
                              symbol,
                              signal,
                              price,
                              histogram
                          )
                      )

              except Exception as e:
                  print(symbol, "HATA:", e)

          for symbol, signal, price, histogram in signals:

              emoji = "🟢" if signal == "AL" else "🔴"

              message = (
                  "🚨 MACD 4H ALARM 🚨\n\n"
                  f"Coin: {symbol}\n"
                  "Timeframe: 4H\n"
                  f"Sinyal: {signal} {emoji}\n"
                  f"Fiyat: {price}\n"
                  f"MACD Histogram: {histogram:.8f}\n\n"
                  "Bybit Linear Futures"
              )

              telegram(message)

              print(
                  "TELEGRAM GONDERILDI:",
                  symbol,
                  signal
              )

          print(
              "Tarama tamamlandi. Yeni sinyal:",
              len(signals)
          )
          PY
