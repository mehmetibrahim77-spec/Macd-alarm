name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD Top 100 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd
          import time

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          def telegram(msg):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  data={"chat_id": CHAT_ID, "text": msg},
                  timeout=20
              )

          # Binance'teki 24 saatlik hacme göre Top 100 USDT
          data = requests.get(
              "https://api.binance.com/api/v3/ticker/24hr",
              timeout=20
          ).json()

          coins = []

          for x in data:
              symbol = x["symbol"]

              if not symbol.endswith("USDT"):
                  continue

              if any(symbol.endswith(s) for s in [
                  "UPUSDT",
                  "DOWNUSDT",
                  "BULLUSDT",
                  "BEARUSDT"
              ]):
                  continue

              try:
                  coins.append(
                      (symbol, float(x["quoteVolume"]))
                  )
              except:
                  pass

          coins.sort(
              key=lambda x: x[1],
              reverse=True
          )

          symbols = [x[0] for x in coins[:100]]

          print(f"Top 100 coin taranıyor: {len(symbols)}")

          for symbol in symbols:

              try:

                  klines = requests.get(
                      "https://api.binance.com/api/v3/klines",
                      params={
                          "symbol": symbol,
                          "interval": "4h",
                          "limit": 100
                      },
                      timeout=20
                  ).json()

                  if not isinstance(klines, list) or len(klines) < 35:
                      continue

                  # Kapanmış 4H mumların kapanış fiyatları
                  closes = pd.Series(
                      [float(k[4]) for k in klines]
                  )

                  # MACD 12 / 26
                  ema12 = closes.ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = closes.ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  # Signal 9
                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  # Histogram
                  histogram = macd - signal

                  # Son mum Binance'te hâlâ oluşuyor olabilir.
                  # Bu nedenle son kapanmış mumu kullanıyoruz.
                  previous = histogram.iloc[-3]
                  current = histogram.iloc[-2]

                  price = closes.iloc[-2]

                  alarm = None

                  # 🔴 KIRMIZIDAN 🟢 YEŞİLE
                  if previous < 0 and current >= 0:
                      alarm = "AL 🟢"

                  # 🟢 YEŞİLDEN 🔴 KIRMIZIYA
                  elif previous >= 0 and current < 0:
                      alarm = "SAT 🔴"

                  if alarm:

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          f"Sinyal: {alarm}\n"
                          f"Fiyat: {price:.8f}\n\n"
                          "MACD histogram renk değiştirdi."
                      )

                      print(message)

                      telegram(message)

                      time.sleep(1)

              except Exception as e:
                  print(f"{symbol} hata: {e}")

          PY
