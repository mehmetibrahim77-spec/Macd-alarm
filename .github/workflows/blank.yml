name: MACD Alarm

on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          SYMBOL = "BTCUSDT"

          data = requests.get(
              "https://api.binance.com/api/v3/klines",
              params={
                  "symbol": SYMBOL,
                  "interval": "4h",
                  "limit": 200
              }
          ).json()

          df = pd.DataFrame(data)

          df["close"] = df[4].astype(float)

          # Açık olan son mumu kullanma
          df = df.iloc[:-1]

          ema12 = df["close"].ewm(span=12, adjust=False).mean()
          ema26 = df["close"].ewm(span=26, adjust=False).mean()

          macd = ema12 - ema26

          current = macd.iloc[-1]
          previous = macd.iloc[-2]

          current_green = current > 0
          previous_green = previous > 0

          if not previous_green and current_green:
              action = "BUY 🟢"
          elif previous_green and not current_green:
              action = "SELL 🔴"
          else:
              action = None

          print("Önceki MACD:", previous)
          print("Güncel MACD:", current)
          print("Sinyal:", action)

          if action:
              price = df["close"].iloc[-1]

              message = (
                  f"MACD 4H ALARM\n\n"
                  f"Coin: {SYMBOL}\n"
                  f"Sinyal: {action}\n"
                  f"Fiyat: {price:.2f}\n"
                  f"MACD: {current:.6f}"
              )

              requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": message
                  }
              )

              print("Telegram mesajı gönderildi.")
          else:
              print("Yeni BUY/SELL yok.")
          PY
