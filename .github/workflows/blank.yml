name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd
          from datetime import datetime, timezone

          # Binance Futures endpoint
          BINANCE = "https://fapi.binance.com"
          COINGECKO = "https://api.coingecko.com/api/v3"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          })

          def telegram(text):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": text
                  },
                  timeout=20
              )

              print("Telegram:", r.status_code, r.text)

              r.raise_for_status()

              if not r.json().get("ok"):
                  raise RuntimeError(r.text)

          def top_200():
              r = session.get(
                  f"{COINGECKO}/coins/markets",
                  params={
                      "vs_currency": "usd",
                      "order": "market_cap_desc",
                      "per_page": 200,
                      "page": 1,
                      "sparkline": "false"
                  },
                  timeout=30
              )

              r.raise_for_status()
              return r.json()

          def binance_symbols():
              r = session.get(
                  f"{BINANCE}/fapi/v1/exchangeInfo",
                  timeout=30
              )

              print("Binance exchangeInfo:", r.status_code)

              r.raise_for_status()

              data = r.json()

              result = {}

              for x in data["symbols"]:
                  if (
                      x["status"] == "TRADING"
                      and x["contractType"] == "PERPETUAL"
                      and x["quoteAsset"] == "USDT"
                  ):
                      result[x["baseAsset"].upper()] = x["symbol"]

              return result

          def klines(symbol):

              r = session.get(
                  f"{BINANCE}/fapi/v1/klines",
                  params={
                      "symbol": symbol,
                      "interval": "4h",
                      "limit": 100
                  },
                  timeout=20
              )

              if r.status_code != 200:
                  print(symbol, "Kline:", r.status_code)
                  return None

              rows = r.json()

              now = int(time.time() * 1000)

              # SADECE KAPANMIŞ MUM
              rows = [
                  x for x in rows
                  if int(x[6]) <= now
              ]

              if len(rows) < 40:
                  return None

              closes = [float(x[4]) for x in rows]
              close_time = int(rows[-1][6])

              return closes, close_time

          def macd(closes):

              s = pd.Series(closes)

              ema12 = s.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = s.ewm(
                  span=26,
                  adjust=False
              ).mean()

              m = ema12 - ema26

              signal = m.ewm(
                  span=9,
                  adjust=False
              ).mean()

              histogram = m - signal

              return histogram

          coins = top_200()
          symbols = binance_symbols()

          print("Top 200:", len(coins))
          print("Binance perpetual:", len(symbols))

          signals = []
          checked = 0

          for rank, coin in enumerate(coins, 1):

              base = coin.get("symbol", "").upper()

              if base not in symbols:
                  continue

              symbol = symbols[base]

              try:

                  data = klines(symbol)

                  if data is None:
                      continue

                  closes, close_time = data

                  h = macd(closes)

                  previous = float(h.iloc[-2])
                  current = float(h.iloc[-1])

                  print(
                      f"{symbol}: "
                      f"{previous:.8f} -> "
                      f"{current:.8f}"
                  )

                  # KIRMIZI -> YEŞİL = AL
                  if previous <= 0 and current > 0:
                      signals.append({
                          "symbol": symbol,
                          "signal": "AL",
                          "price": closes[-1],
                          "hist": current,
                          "rank": rank,
                          "close": close_time
                      })

                  # YEŞİL -> KIRMIZI = SAT
                  elif previous >= 0 and current < 0:
                      signals.append({
                          "symbol": symbol,
                          "signal": "SAT",
                          "price": closes[-1],
                          "hist": current,
                          "rank": rank,
                          "close": close_time
                      })

                  checked += 1

              except Exception as e:
                  print(symbol, "HATA:", e)

              time.sleep(0.05)

          print("================================")
          print("TARAMA BİTTİ")
          print("Kontrol:", checked)
          print("Sinyal:", len(signals))
          print("================================")

          for x in signals:

              emoji = "🟢" if x["signal"] == "AL" else "🔴"

              dt = datetime.fromtimestamp(
                  x["close"] / 1000,
                  timezone.utc
              )

              message = (
                  "🚨 MACD 4H ALARM 🚨\n\n"
                  f"Coin: {x['symbol']}\n"
                  "Timeframe: 4H\n"
                  f"Sinyal: {x['signal']} {emoji}\n"
                  f"Fiyat: {x['price']}\n"
                  f"MACD Histogram: {x['hist']:.8f}\n"
                  f"Top 200: #{x['rank']}\n"
                  f"Mum kapanışı: "
                  f"{dt.strftime('%Y-%m-%d %H:%M UTC')}"
              )

              telegram(message)

          if not signals:
              print("Yeni MACD sinyali yok.")

          print("İşlem tamamlandı.")
          PY
