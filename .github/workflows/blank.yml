name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: CoinGecko 4H MACD TEST
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import requests
          import pandas as pd

          # BTC test
          url = "https://api.coingecko.com/api/v3/coins/bitcoin/ohlc"

          params = {
              "vs_currency": "usd",
              "days": "30"
          }

          r = requests.get(
              url,
              params=params,
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("URL:", r.url)
          print("Cevap:", r.text[:500])

          r.raise_for_status()

          data = r.json()

          if not isinstance(data, list):
              raise RuntimeError(
                  f"Beklenmeyen cevap: {data}"
              )

          print("Toplam mum:", len(data))

          closes = pd.Series([
              float(x[4])
              for x in data
          ])

          if len(closes) < 35:
              raise RuntimeError(
                  "MACD için yeterli mum yok."
              )

          ema12 = closes.ewm(
              span=12,
              adjust=False
          ).mean()

          ema26 = closes.ewm(
              span=26,
              adjust=False
          ).mean()

          macd = ema12 - ema26

          signal = macd.ewm(
              span=9,
              adjust=False
          ).mean()

          histogram = macd - signal

          previous = histogram.iloc[-2]
          current = histogram.iloc[-1]

          print("--------------------------------")
          print("BTC TEST")
          print("Önceki histogram:", previous)
          print("Son histogram:", current)

          if previous < 0 and current >= 0:
              print("🟢 AL SİNYALİ")

          elif previous >= 0 and current < 0:
              print("🔴 SAT SİNYALİ")

          else:
              print("Sinyal yok.")

          print("--------------------------------")
          print("✅ CoinGecko 4H MACD TEST BAŞARILI")

          PY
