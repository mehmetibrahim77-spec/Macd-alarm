name: MACD Alarm

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  macd:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        interval: ["15m", "1h", "4h", "1d"]

    steps:
      - name: MACD kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          SYMBOL = "BTCUSDT"
          INTERVAL = "${{ matrix.interval }}"

          # Binance ana API yerine public market-data endpoint
          url = "https://data-api.binance.vision/api/v3/klines"

          response = requests.get(
              url,
              params={
                  "symbol": SYMBOL,
                  "interval": INTERVAL,
                  "limit": 200
              },
              timeout=20
          )

          print("HTTP:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          data = response.json()

          if not isinstance(data, list) or len(data) < 50:
              print("Yeterli veri yok.")
              raise SystemExit(1)

          df = pd.DataFrame(data)

          df["close"] = pd.to_numeric(df[4])

          # Açık mumu kullanma
          df = df.iloc[:-1].copy()

          # MACD
          ema12 = df["close"].ewm(
              span=12,
              adjust=False
          ).mean()

          ema26 = df["close"].ewm(
              span=26,
              adjust=False
          ).mean()

          macd = ema12 - ema26

          # Signal = MACD'nin 9 EMA'sı
          signal = macd.ewm(
              span=9,
              adjust=False
          ).mean()

          previous_macd = macd.iloc[-2]
          current_macd = macd.iloc[-1]

          previous_signal = signal.iloc[-2]
          current_signal = signal.iloc[-1]

          print("Timeframe:", INTERVAL)
          print("Previous MACD:", previous_macd)
          print("Current MACD:", current_macd)
          print("Previous Signal:", previous_signal)
          print("Current Signal:", current_signal)

          # MACD signal'i yukarı keserse AL
          buy = (
              previous_macd <= previous_signal
              and current_macd > current_signal
          )

          # MACD signal'i aşağı keserse SAT
          sell = (
              previous_macd >= previous_signal
              and current_macd < current_signal
          )

          if buy:
              action = "BUY 🟢"
          elif sell:
              action = "SELL 🔴"
          else:
              action = None

          print("Sinyal:", action)

          if action:

              price = float(df["close"].iloc[-1])

              message = (
                  f"MACD ALARM\n\n"
                  f"Coin: {SYMBOL}\n"
                  f"Timeframe: {INTERVAL}\n"
                  f"Sinyal: {action}\n"
                  f"Fiyat: {price:.2f}\n"
                  f"MACD: {current_macd:.6f}\n"
                  f"Signal: {current_signal:.6f}"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  f"{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
              )

              telegram_response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram HTTP:", telegram_response.status_code)
              print("Telegram:", telegram_response.text)

              if telegram_response.status_code != 200:
                  raise SystemExit(1)

              print("Telegram mesajı gönderildi.")

          else:
              print("Yeni BUY/SELL yok.")

          PY

