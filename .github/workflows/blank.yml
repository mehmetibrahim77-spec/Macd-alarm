name: MACD Top 100 - 4H

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD 4H Top 100
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -m pip install --user requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          BINANCE_URL = "https://data-api.binance.vision"
          INTERVAL = "4h"

          print("===================================")
          print("MACD TOP 100 - 4H")
          print("===================================")

          # ------------------------------------------------
          # 1. BINANCE'TEKİ GEÇERLİ USDT PARİTLERİNİ AL
          # ------------------------------------------------

          exchange = requests.get(
              f"{BINANCE_URL}/api/v3/exchangeInfo",
              timeout=30
          ).json()

          binance_symbols = set()

          for symbol in exchange["symbols"]:
              if (
                  symbol["status"] == "TRADING"
                  and symbol["quoteAsset"] == "USDT"
                  and symbol["isSpotTradingAllowed"]
              ):
                  binance_symbols.add(symbol["symbol"])

          print("Binance USDT pariteleri:", len(binance_symbols))

          # ------------------------------------------------
          # 2. TOP 100 COINLERİ COINMARKETCAP'TEN AL
          # ------------------------------------------------

          cmc_url = (
              "https://pro-api.coinmarketcap.com/"
              "public-api/v3/cryptocurrency/listings/latest"
          )

          cmc_response = requests.get(
              cmc_url,
              params={
                  "start": 1,
                  "limit": 100,
                  "convert": "USD"
              },
              timeout=30
          )

          if cmc_response.status_code != 200:
              print("CoinMarketCap hata:")
              print(cmc_response.text)
              raise SystemExit(1)

          top100 = cmc_response.json()["data"]

          print("Top 100 coin alındı.")

          # ------------------------------------------------
          # 3. SADECE BINANCE'TE USDT PARİTESİ OLANLARI SEÇ
          # ------------------------------------------------

          coins = []

          for coin in top100:

              symbol = coin["symbol"].upper()

              # Stablecoinleri atla
              stablecoins = {
                  "USDT",
                  "USDC",
                  "FDUSD",
                  "TUSD",
                  "USDE",
                  "DAI"
              }

              if symbol in stablecoins:
                  continue

              binance_pair = symbol + "USDT"

              if binance_pair in binance_symbols:
                  coins.append(binance_pair)

          print("Tarama yapılacak coin sayısı:", len(coins))

          print(coins)

          # ------------------------------------------------
          # 4. HER COİN İÇİN MACD HESAPLA
          # ------------------------------------------------

          for SYMBOL in coins:

              try:

                  print("\n-----------------------------------")
                  print("COIN:", SYMBOL)

                  response = requests.get(
                      f"{BINANCE_URL}/api/v3/klines",
                      params={
                          "symbol": SYMBOL,
                          "interval": INTERVAL,
                          "limit": 200
                      },
                      timeout=20
                  )

                  if response.status_code != 200:
                      print("Kline alınamadı.")
                      continue

                  data = response.json()

                  if len(data) < 50:
                      print("Yeterli veri yok.")
                      continue

                  df = pd.DataFrame(data)

                  # Kapanış fiyatı
                  df["close"] = pd.to_numeric(df[4])

                  # Son mum henüz kapanmamış olabilir.
                  # Bu yüzden son mumu kullanmıyoruz.
                  df = df.iloc[:-1].copy()

                  # ------------------------------------------------
                  # MACD 12 / 26 / 9
                  # ------------------------------------------------

                  ema12 = df["close"].ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = df["close"].ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  # Önceki kapanmış mum
                  previous_macd = macd.iloc[-2]
                  previous_signal = signal.iloc[-2]

                  # Son kapanmış 4H mum
                  current_macd = macd.iloc[-1]
                  current_signal = signal.iloc[-1]

                  price = float(df["close"].iloc[-1])

                  # ------------------------------------------------
                  # AL / SAT
                  # ------------------------------------------------

                  buy = (
                      previous_macd <= previous_signal
                      and current_macd > current_signal
                  )

                  sell = (
                      previous_macd >= previous_signal
                      and current_macd < current_signal
                  )

                  print("Fiyat:", price)
                  print("MACD:", current_macd)
                  print("Signal:", current_signal)

                  if buy:

                      action = "AL 🟢"

                  elif sell:

                      action = "SAT 🔴"

                  else:

                      print("Sinyal yok.")
                      continue

                  # ------------------------------------------------
                  # TELEGRAM
                  # ------------------------------------------------

                  message = (
                      "🚨 MACD 4H ALARM 🚨\n\n"
                      f"Coin: {SYMBOL}\n"
                      "Timeframe: 4H\n"
                      f"Sinyal: {action}\n"
                      f"Fiyat: {price:.8f}\n"
                      f"MACD: {current_macd:.8f}\n"
                      f"Signal: {current_signal:.8f}"
                  )

                  print(message)

                  token = os.environ.get(
                      "TELEGRAM_BOT_TOKEN"
                  )

                  chat_id = os.environ.get(
                      "TELEGRAM_CHAT_ID"
                  )

                  if not token or not chat_id:

                      print(
                          "Telegram secret bulunamadı."
                      )

                      continue

                  telegram_url = (
                      f"https://api.telegram.org/"
                      f"bot{token}/sendMessage"
                  )

                  telegram_response = requests.post(
                      telegram_url,
                      data={
                          "chat_id": chat_id,
                          "text": message
                      },
                      timeout=20
                  )

                  print(
                      "Telegram:",
                      telegram_response.status_code
                  )

              except Exception as e:

                  print(
                      f"{SYMBOL} hata verdi: {e}"
                  )

                  # Bir coin hata verse bile
                  # diğer coinler devam etsin.
                  continue

          print("\n===================================")
          print("TARAMA TAMAMLANDI")
          print("===================================")

          PY
