name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

          python <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          BYBIT = "https://api.bybit.com"
          CMC = "https://pro-api.coinmarketcap.com/public-api"

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          if not TOKEN:
              raise RuntimeError("TELEGRAM_BOT_TOKEN secret bulunamadı.")

          if not CHAT_ID:
              raise RuntimeError("TELEGRAM_CHAT_ID secret bulunamadı.")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MACD-Alarm/1.0",
              "Accept": "application/json"
          })


          # ------------------------------------------------------------
          # TELEGRAM
          # ------------------------------------------------------------

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              if not r.ok:
                  raise RuntimeError(
                      f"Telegram HTTP {r.status_code}: {r.text[:500]}"
                  )

              data = r.json()

              if not data.get("ok"):
                  raise RuntimeError(
                      f"Telegram API hatası: {data}"
                  )


          # ------------------------------------------------------------
          # COINMARKETCAP - MARKET CAP TOP 200
          # ------------------------------------------------------------

          def get_cmc_top_200():

              url = f"{CMC}/v3/cryptocurrency/listings/latest"

              params = {
                  "start": 1,
                  "limit": 200,
                  "convert": "USD",
                  "sort": "market_cap"
              }

              print("CMC Top 200 market-cap isteniyor...")
              print(f"CMC URL: {url}")

              r = session.get(
                  url,
                  params=params,
                  timeout=30
              )

              print(f"CMC HTTP status: {r.status_code}")

              if not r.ok:
                  raise RuntimeError(
                      f"CMC HTTP {r.status_code}: {r.text[:1000]}"
                  )

              data = r.json()

              if "data" not in data:
                  raise RuntimeError(
                      f"CMC cevapta data yok: {data}"
                  )

              coins = data["data"]

              if not coins:
                  raise RuntimeError(
                      "CMC Top 200 boş geldi."
                  )

              print(f"CMC Top 200 başarıyla alındı: {len(coins)} coin")

              return coins


          # ------------------------------------------------------------
          # BYBIT LINEAR PERPETUAL
          # ------------------------------------------------------------

          def get_bybit_symbols():

              url = f"{BYBIT}/v5/market/instruments-info"

              cursor = None
              symbols = {}

              while True:

                  params = {
                      "category": "linear",
                      "limit": 1000
                  }

                  if cursor:
                      params["cursor"] = cursor

                  r = session.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  if not r.ok:
                      raise RuntimeError(
                          f"Bybit instruments HTTP {r.status_code}: "
                          f"{r.text[:1000]}"
                      )

                  data = r.json()

                  if data.get("retCode") != 0:
                      raise RuntimeError(
                          f"Bybit instruments API hatası: {data}"
                      )

                  result = data.get("result", {})

                  for item in result.get("list", []):

                      symbol = item.get("symbol", "")
                      status = item.get("status", "")
                      contract_type = item.get("contractType", "")
                      base_coin = item.get("baseCoin", "").upper()

                      if (
                          symbol.endswith("USDT")
                          and status == "Trading"
                          and contract_type == "LinearPerpetual"
                          and base_coin
                      ):
                          symbols[base_coin] = symbol

                  cursor = result.get("nextPageCursor")

                  if not cursor:
                      break

              print(
                  f"Bybit USDT Linear Perpetual sayısı: {len(symbols)}"
              )

              return symbols


          # ------------------------------------------------------------
          # BYBIT 4H KAPANMIŞ MUM
          # ------------------------------------------------------------

          def get_klines(symbol):

              url = f"{BYBIT}/v5/market/kline"

              params = {
                  "category": "linear",
                  "symbol": symbol,
                  "interval": "240",
                  "limit": 100
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=20
              )

              if not r.ok:
                  raise RuntimeError(
                      f"{symbol} kline HTTP {r.status_code}: "
                      f"{r.text[:500]}"
                  )

              data = r.json()

              if data.get("retCode") != 0:
                  raise RuntimeError(
                      f"{symbol} kline API hatası: {data}"
                  )

              rows = data.get("result", {}).get("list", [])

              if len(rows) < 40:
                  print(
                      f"{symbol}: yeterli mum yok ({len(rows)})"
                  )
                  return None

              rows = sorted(
                  rows,
                  key=lambda x: int(x[0])
              )

              # En son mum açık mumdur.
              # Sadece kapanmış 4H mumları kullan.
              rows = rows[:-1]

              closes = [
                  float(row[4])
                  for row in rows
              ]

              return closes


          # ------------------------------------------------------------
          # MACD 12 / 26 / 9
          # ------------------------------------------------------------

          def check_macd(closes):

              if closes is None or len(closes) < 35:
                  return None

              close = pd.Series(
                  closes,
                  dtype="float64"
              )

              ema12 = close.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = close.ewm(
                  span=26,
                  adjust=False
              ).mean()

              macd = ema12 - ema26

              signal = macd.ewm(
                  span=9,
                  adjust=False
              ).mean()

              prev_macd = float(macd.iloc[-2])
              prev_signal = float(signal.iloc[-2])

              curr_macd = float(macd.iloc[-1])
              curr_signal = float(signal.iloc[-1])

              price = float(close.iloc[-1])

              # AL:
              # MACD Signal'ın altında/eşitken
              # sonraki kapanmış mumda üstüne geçiyor.
              if (
                  prev_macd <= prev_signal
                  and curr_macd > curr_signal
              ):
                  return "AL", price

              # SAT:
              # MACD Signal'ın üstünde/eşitken
              # sonraki kapanmış mumda altına geçiyor.
              if (
                  prev_macd >= prev_signal
                  and curr_macd < curr_signal
              ):
                  return "SAT", price

              return None


          # ------------------------------------------------------------
          # ANA PROGRAM
          # ------------------------------------------------------------

          print("")
          print("========================================")
          print("MACD ALARM BAŞLADI")
          print("========================================")

          try:

              cmc_coins = get_cmc_top_200()

              bybit_symbols = get_bybit_symbols()

              matched_coins = []

              for coin in cmc_coins:

                  symbol = str(
                      coin.get("symbol", "")
                  ).upper()

                  rank = coin.get("cmc_rank")

                  if symbol in bybit_symbols:

                      matched_coins.append({
                          "name": coin.get("name", symbol),
                          "symbol": symbol,
                          "rank": rank,
                          "bybit_symbol": bybit_symbols[symbol]
                      })


              print(
                  f"CMC Top 200: {len(cmc_coins)}"
              )

              print(
                  f"Bybit eşleşmesi: {len(matched_coins)}"
              )

              print("")
              print("4H MACD taraması başlıyor...")
              print("")


              signals_found = 0
              errors = 0

              for coin in matched_coins:

                  name = coin["name"]
                  symbol = coin["symbol"]
                  rank = coin["rank"]
                  bybit_symbol = coin["bybit_symbol"]

                  try:

                      print(
                          f"Taranıyor #{rank}: "
                          f"{symbol} -> {bybit_symbol}"
                      )

                      closes = get_klines(
                          bybit_symbol
                      )

                      result = check_macd(
                          closes
                      )

                      if result is None:
                          continue

                      signal, price = result

                      signals_found += 1

                      if signal == "AL":

                          emoji = "🟢"

                          description = (
                              "MACD, Signal çizgisini "
                              "aşağıdan yukarı kesti."
                          )

                      else:

                          emoji = "🔴"

                          description = (
                              "MACD, Signal çizgisini "
                              "yukarıdan aşağı kesti."
                          )


                      message = (
                          f"🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}USDT\n"
                          f"CMC Rank: #{rank}\n"
                          f"Timeframe: 4H\n"
                          f"Sinyal: {signal} {emoji}\n"
                          f"Fiyat: {price}\n\n"
                          f"{description}"
                      )

                      print(
                          f"!!! SİNYAL !!! "
                          f"{symbol} {signal}"
                      )

                      send_telegram(
                          message
                      )

                      time.sleep(0.2)


                  except Exception as e:

                      errors += 1

                      print(
                          f"HATA - {symbol} "
                          f"({bybit_symbol}): {e}"
                      )

                      continue


              print("")
              print("========================================")
              print("TARAMA TAMAMLANDI")
              print("========================================")
              print(
                  f"CMC Top 200: {len(cmc_coins)}"
              )
              print(
                  f"Bybit eşleşmesi: {len(matched_coins)}"
              )
              print(
                  f"MACD sinyali: {signals_found}"
              )
              print(
                  f"Coin hatası: {errors}"
              )
              print("========================================")


          except Exception as e:

              print("")
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print("ANA PROGRAM HATASI")
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print(str(e))
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")

              raise

          PY
