name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          pip install requests pandas

      - name: MACD tara ve Telegram gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python <<'PY'
          import requests
          import pandas as pd
          import time
          import re

          TV_URL = "https://scanner.tradingview.com/crypto/scan"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
              "Origin": "https://www.tradingview.com",
              "Referer": "https://www.tradingview.com/"
          }

          # ============================================================
          # 1) GERÇEK MARKET CAP TOP 200
          # ============================================================

          payload = {
              "filter": [
                  {
                      "left": "market_cap_basic",
                      "operation": "greater",
                      "right": 0
                  },
                  {
                      "left": "name",
                      "operation": "match",
                      "right": ".*USDT$"
                  }
              ],
              "options": {
                  "lang": "en"
              },
              "markets": [
                  "crypto"
              ],
              "symbols": {
                  "query": {
                      "types": []
                  },
                  "tickers": []
              },
              "columns": [
                  "name",
                  "ticker",
                  "market_cap_basic",
                  "exchange",
                  "close"
              ],
              "sort": {
                  "sortBy": "market_cap_basic",
                  "sortOrder": "desc"
              },
              "range": [
                  0,
                  500
              ]
          }

          r = requests.post(
              TV_URL,
              headers=HEADERS,
              json=payload,
              timeout=30
          )

          r.raise_for_status()

          data = r.json().get("data", [])

          if not data:
              raise Exception("TradingView Top 200 verisi alınamadı.")

          # ============================================================
          # 2) SADECE GERÇEK USDT SPOT PARİTELERİ
          # ============================================================

          # Büyük CEX'ler.
          # Böylece DEX / kaldıraçlı / garip token pariteleri
          # mümkün olduğunca dışarıda tutulur.
          allowed_exchanges = {
              "BINANCE",
              "BYBIT",
              "OKX",
              "COINBASE",
              "KRAKEN",
              "KUCOIN",
              "GATEIO",
              "BITGET",
              "MEXC",
              "BITFINEX",
              "CRYPTOCOM"
          }

          coins = []

          for item in data:
              symbol = item.get("s", "")
              values = item.get("d", [])

              if len(values) < 5:
                  continue

              name = values[0]
              ticker = values[1]
              market_cap = values[2]
              exchange = values[3]

              if not ticker:
                  continue

              if not str(ticker).upper().endswith("USDT"):
                  continue

              if exchange and str(exchange).upper() not in allowed_exchanges:
                  continue

              if market_cap is None:
                  continue

              # Kaldıraçlı tokenleri ele
              upper_name = str(name).upper()

              bad_words = [
                  "3L", "3S",
                  "5L", "5S",
                  "UP", "DOWN",
                  "BULL", "BEAR",
                  "LONG", "SHORT"
              ]

              if any(
                  upper_name.endswith(x) or
                  upper_name.endswith(x + "USDT")
                  for x in bad_words
              ):
                  continue

              coins.append({
                  "ticker": ticker,
                  "name": name,
                  "market_cap": float(market_cap),
                  "exchange": exchange
              })

          # Market cap'e göre tekrar sırala
          coins.sort(
              key=lambda x: x["market_cap"],
              reverse=True
          )

          # Aynı coin birden fazla borsadaysa yalnızca ilkini al.
          # Böylece 200 coin hedefliyoruz, 200 parite değil.
          selected = []
          seen_bases = set()

          for coin in coins:

              ticker = str(coin["ticker"])

              # Örn:
              # BINANCE:BTCUSDT
              # BTCUSDT
              base = ticker.split(":")[-1]

              if base.endswith("USDT"):
                  base = base[:-4]

              if base in seen_bases:
                  continue

              seen_bases.add(base)
              selected.append(coin)

              if len(selected) >= 200:
                  break

          print("========================================")
          print("MARKET CAP TOP 200")
          print("Bulunan coin sayısı:", len(selected))
          print("========================================")

          for i, coin in enumerate(selected[:20], 1):
              print(
                  i,
                  coin["name"],
                  coin["ticker"],
                  f"MCAP={coin['market_cap']:,.0f}"
              )

          if not selected:
              raise Exception("Market Cap Top 200 listesi boş.")

          # ============================================================
          # 3) TOP 200 İÇİN 4H MACD VERİSİNİ ÇEK
          # ============================================================

          tickers = [x["ticker"] for x in selected]

          macd_payload = {
              "filter": [
                  {
                      "left": "name",
                      "operation": "match",
                      "right": ".*USDT$"
                  }
              ],
              "options": {
                  "lang": "en"
              },
              "markets": [
                  "crypto"
              ],
              "symbols": {
                  "query": {
                      "types": []
                  },
                  "tickers": tickers
              },
              "columns": [
                  "name",
                  "close",

                  "MACD.macd|240",
                  "MACD.signal|240",

                  "MACD.macd[1]|240",
                  "MACD.signal[1]|240",

                  "MACD.macd[2]|240",
                  "MACD.signal[2]|240"
              ],
              "range": [
                  0,
                  500
              ]
          }

          r2 = requests.post(
              TV_URL,
              headers=HEADERS,
              json=macd_payload,
              timeout=30
          )

          r2.raise_for_status()

          macd_data = r2.json().get("data", [])

          # ============================================================
          # 4) MACD HISTOGRAM RENK / YÖN DEĞİŞİMİ
          # ============================================================

          signals = []

          for item in macd_data:

              symbol = item.get("s", "")
              values = item.get("d", [])

              if len(values) < 8:
                  continue

              name = values[0]
              price = values[1]

              macd0 = values[2]
              signal0 = values[3]

              macd1 = values[4]
              signal1 = values[5]

              macd2 = values[6]
              signal2 = values[7]

              numbers = [
                  macd0, signal0,
                  macd1, signal1,
                  macd2, signal2
              ]

              if any(x is None for x in numbers):
                  continue

              # Histogram
              h1 = macd0 - signal0
              h2 = macd1 - signal1
              h3 = macd2 - signal2

              # Son KAPANMIŞ 4H mumdaki histogram eğimi
              current_slope = h1 - h2

              # Ondan önceki kapanmış mumdaki histogram eğimi
              previous_slope = h2 - h3

              signal = None

              # 🔴 Düşüyordu -> 🟢 yükselmeye başladı
              if previous_slope <= 0 and current_slope > 0:
                  signal = "AL 🟢"

              # 🟢 Yükseliyordu -> 🔴 düşmeye başladı
              elif previous_slope >= 0 and current_slope < 0:
                  signal = "SAT 🔴"

              if signal:
                  signals.append({
                      "symbol": symbol,
                      "name": name,
                      "price": price,
                      "signal": signal,
                      "histogram": h1
                  })

          # ============================================================
          # 5) TELEGRAM
          # ============================================================

          token = "${TELEGRAM_BOT_TOKEN}"
          chat_id = "${TELEGRAM_CHAT_ID}"

          # GitHub env değerlerini Python'a güvenli şekilde al
          import os

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              raise Exception(
                  "TELEGRAM_BOT_TOKEN veya TELEGRAM_CHAT_ID bulunamadı."
              )

          if not signals:
              print("Bu taramada yeni MACD sinyali yok.")
              exit(0)

          for s in signals:

              symbol = s["symbol"].split(":")[-1]

              message = (
                  "🚨 MACD 4H ALARM 🚨\n\n"
                  f"Coin: {symbol}\n"
                  "Timeframe: 4H\n"
                  f"Sinyal: {s['signal']}\n"
                  f"Fiyat: {s['price']}\n"
                  f"Histogram: {s['histogram']:.8f}\n\n"
                  "📊 Market Cap Top 200"
              )

              url = (
                  f"https://api.telegram.org/bot{token}/sendMessage"
              )

              response = requests.post(
                  url,
                  data={
                      "chat_id": chat_id,
                      "text": message
                  },
                  timeout=20
              )

              response.raise_for_status()

              print("Telegram gönderildi:", symbol)

          print("========================================")
          print("Tarama tamamlandı.")
          print("Sinyal sayısı:", len(signals))
          print("========================================")
          PY
