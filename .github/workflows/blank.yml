name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 100 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          BINANCE = "https://api.binance.com"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              response = requests.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram:", response.status_code)

          # Binance 24 saatlik veriyi al
          response = requests.get(
              f"{BINANCE}/api/v3/ticker/24hr",
              timeout=20
          )

          response.raise_for_status()

          data = response.json()

          # Binance'in liste döndürdüğünden emin ol
          if not isinstance(data, list):
              raise RuntimeError(
                  f"Binance beklenmeyen cevap döndürdü: {data}"
              )

          coins = []

          for item in data:

              if not isinstance(item, dict):
                  continue

              symbol = item.get("symbol", "")

              if not symbol.endswith("USDT"):
                  continue

              # Kaldıraçlı tokenları çıkar
              if any(x in symbol for x in [
                  "UPUSDT",
                  "DOWNUSDT",
                  "BULLUSDT",
                  "BEARUSDT"
              ]):
                  continue

              try:
                  volume = float(item["quoteVolume"])
                  coins.append((symbol, volume))
              except:
                  continue

          # Hacme göre sırala
          coins.sort(
              key=lambda x: x[1],
              reverse=True
          )

          symbols = [
              x[0]
              for x in coins[:100]
          ]

          print(f"Top 100 coin bulundu: {len(symbols)}")

          if len(symbols) == 0:
              raise RuntimeError(
                  "Binance'ten USDT coin listesi alınamadı."
              )

          # Her coin için 4H MACD
          for symbol in symbols:

              try:

                  response = requests.get(
                      f"{BINANCE}/api/v3/klines",
                      params={
                          "symbol": symbol,
                          "interval": "4h",
                          "limit": 100
                      },
                      timeout=20
                  )

                  if response.status_code != 200:
                      print(
                          f"{symbol}: Binance HTTP {response.status_code}"
                      )
                      continue

                  klines = response.json()

                  if not isinstance(klines, list):
                      continue

                  if len(klines) < 35:
                      continue

                  # Kapanış fiyatları
                  closes = pd.Series([
                      float(k[4])
                      for k in klines
                  ])

                  # MACD 12 / 26
                  ema12 = closes.ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = closes.ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  # Signal 9
                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  # Histogram
                  histogram = macd - signal

                  # Son kapanmış 4H mum
                  previous = histogram.iloc[-3]
                  current = histogram.iloc[-2]

                  price = closes.iloc[-2]

                  alarm = None

                  # 🔴 → 🟢
                  if previous < 0 and current >= 0:
                      alarm = "AL 🟢"

                  # 🟢 → 🔴
                  elif previous >= 0 and current < 0:
                      alarm = "SAT 🔴"

                  if alarm:

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          f"Sinyal: {alarm}\n"
                          f"Fiyat: {price:.8f}\n\n"
                          f"Histogram: "
                          f"{previous:.8f} → {current:.8f}"
                      )

                      print(message)

                      send_telegram(message)

                      time.sleep(1)

              except Exception as e:

                  print(
                      f"{symbol} hata: {type(e).__name__}: {e}"
                  )

          print(
              "✅ MACD Top 100 - 4H taraması tamamlandı."
          )

          PY
