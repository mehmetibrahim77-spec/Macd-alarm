name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          BYBIT = "https://api.bybit.com"
          CMC = "https://pro-api.coinmarketcap.com/public-api"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MACD-Alarm/1.0",
              "Accept": "application/json"
          })


          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              response = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              response.raise_for_status()


          # ============================================================
          # COINMARKETCAP TOP 200 - MARKET CAP
          # ============================================================

          def get_cmc_top_200():
              url = f"{CMC}/v3/cryptocurrency/listings/latest"

              params = {
                  "start": 1,
                  "limit": 200,
                  "convert": "USD",
                  "sort": "market_cap"
              }

              response = session.get(
                  url,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()

              data = response.json()

              if "data" not in data:
                  raise RuntimeError(
                      f"CMC cevap hatası: {data}"
                  )

              coins = data["data"]

              if len(coins) == 0:
                  raise RuntimeError(
                      "CMC Top 200 listesi boş geldi."
                  )

              return coins


          # ============================================================
          # BYBIT LINEAR PERPETUAL CONTRACTS
          # ============================================================

          def get_bybit_symbols():
              url = f"{BYBIT}/v5/market/instruments-info"

              cursor = None
              symbols = {}

              while True:
                  params = {
                      "category": "linear",
                      "limit": 1000
                  }

                  if cursor:
                      params["cursor"] = cursor

                  response = session.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  response.raise_for_status()

                  data = response.json()

                  if data.get("retCode") != 0:
                      raise RuntimeError(
                          f"Bybit instruments hatası: {data}"
                      )

                  result = data.get("result", {})

                  for item in result.get("list", []):
                      symbol = item.get("symbol", "")
                      status = item.get("status", "")
                      contract_type = item.get("contractType", "")
                      base_coin = item.get("baseCoin", "").upper()

                      if (
                          symbol.endswith("USDT")
                          and status == "Trading"
                          and contract_type == "LinearPerpetual"
                          and base_coin
                      ):
                          symbols[base_coin] = symbol

                  cursor = result.get("nextPageCursor")

                  if not cursor:
                      break

              return symbols


          # ============================================================
          # BYBIT 4H KLINE
          # ============================================================

          def get_klines(symbol):
              url = f"{BYBIT}/v5/market/kline"

              params = {
                  "category": "linear",
                  "symbol": symbol,
                  "interval": "240",
                  "limit": 100
              }

              response = session.get(
                  url,
                  params=params,
                  timeout=20
              )

              response.raise_for_status()

              data = response.json()

              if data.get("retCode") != 0:
                  raise RuntimeError(
                      f"Kline hatası: {data}"
                  )

              rows = data.get("result", {}).get("list", [])

              if len(rows) < 40:
                  return None

              # Bybit en yeni mumu ilk sırada döndürür.
              # Zamana göre eskiden yeniye sırala.
              rows = sorted(
                  rows,
                  key=lambda x: int(x[0])
              )

              # Son mum açık 4H mumu olabilir.
              # Açık mumu kullanma.
              rows = rows[:-1]

              closes = [
                  float(row[4])
                  for row in rows
              ]

              return closes


          # ============================================================
          # MACD 12 / 26 / 9
          # ============================================================

          def check_macd(closes):

              if closes is None or len(closes) < 35:
                  return None

              close = pd.Series(closes, dtype="float64")

              ema12 = close.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = close.ewm(
                  span=26,
                  adjust=False
              ).mean()

              macd = ema12 - ema26

              signal = macd.ewm(
                  span=9,
                  adjust=False
              ).mean()

              # Son iki KAPANMIŞ 4H mum
              prev_macd = float(macd.iloc[-2])
              prev_signal = float(signal.iloc[-2])

              curr_macd = float(macd.iloc[-1])
              curr_signal = float(signal.iloc[-1])

              price = float(close.iloc[-1])

              # ========================================================
              # AL
              # MACD aşağıdan yukarı Signal çizgisini kesiyor
              # ========================================================

              if (
                  prev_macd <= prev_signal
                  and curr_macd > curr_signal
              ):
                  return "AL", price


              # ========================================================
              # SAT
              # MACD yukarıdan aşağı Signal çizgisini kesiyor
              # ========================================================

              if (
                  prev_macd >= prev_signal
                  and curr_macd < curr_signal
              ):
                  return "SAT", price


              return None


          # ============================================================
          # ANA TARAMA
          # ============================================================

          print("========================================")
          print("MACD ALARM BAŞLADI")
          print("========================================")

          print("CMC Top 200 market-cap listesi alınıyor...")

          cmc_coins = get_cmc_top_200()

          print(
              f"CMC'den {len(cmc_coins)} coin alındı."
          )

          print("Bybit USDT Linear Perpetual kontratları alınıyor...")

          bybit_symbols = get_bybit_symbols()

          print(
              f"Bybit'te {len(bybit_symbols)} adet uygun kontrat bulundu."
          )


          # ============================================================
          # TOP 200 MARKET CAP + BYBIT EŞLEŞT
