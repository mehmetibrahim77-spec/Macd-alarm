name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          pip install requests

      - name: Top 200 Market Cap + 4H MACD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python <<'PY'
          import requests
          import os
          import re

          TV_URL = "https://scanner.tradingview.com/crypto/scan"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
              "Origin": "https://www.tradingview.com",
              "Referer": "https://www.tradingview.com/"
          }

          # ============================================================
          # 1 — GERÇEK TOP 200 MARKET CAP
          # CoinGecko market-cap sıralaması
          # ============================================================

          cg_url = (
              "https://api.coingecko.com/api/v3/coins/markets"
              "?vs_currency=usd"
              "&order=market_cap_desc"
              "&per_page=200"
              "&page=1"
              "&sparkline=false"
          )

          cg = requests.get(cg_url, timeout=30)
          cg.raise_for_status()

          market_coins = cg.json()

          if not market_coins:
              raise Exception("CoinGecko Top 200 alınamadı.")

          print("========================================")
          print("COINGECKO MARKET CAP TOP 200")
          print("Coin sayısı:", len(market_coins))
          print("========================================")

          # CoinGecko symbol -> market cap sırası
          top_coins = []

          for coin in market_coins:
              coin_id = coin.get("id")
              symbol = str(coin.get("symbol", "")).upper()

              if not symbol:
                  continue

              top_coins.append({
                  "id": coin_id,
                  "symbol": symbol,
                  "name": coin.get("name"),
                  "market_cap": coin.get("market_cap") or 0,
                  "rank": coin.get("market_cap_rank")
              })

          # Aynı sembolden olası tekrarları kaldır
          allowed_symbols = {}

          for coin in top_coins:
              sym = coin["symbol"]

              if sym not in allowed_symbols:
                  allowed_symbols[sym] = coin

          print("Benzersiz coin:", len(allowed_symbols))

          # ============================================================
          # 2 — TRADINGVIEW'DAN USDT PARİTELERİNİ BUL
          #
          # Buradaki hacim artık TOP 200 seçmek için kullanılmıyor.
          # Sadece aynı coin için hangi USDT paritesini kullanacağımızı
          # seçmek için kullanılıyor.
          # ============================================================

          tv_payload = {
              "filter": [
                  {
                      "left": "name",
                      "operation": "match",
                      "right": ".*USDT$"
                  }
              ],
              "options": {
                  "lang": "en"
              },
              "markets": [
                  "crypto"
              ],
              "symbols": {
                  "query": {
                      "types": []
                  },
                  "tickers": []
              },
              "columns": [
                  "name",
                  "close",
                  "volume"
              ],
              "sort": {
                  "sortBy": "volume",
                  "sortOrder": "desc"
              },
              "range": [
                  0,
                  1000
              ]
          }

          tv = requests.post(
              TV_URL,
              headers=HEADERS,
              json=tv_payload,
              timeout=30
          )

          tv.raise_for_status()

          tv_data = tv.json().get("data", [])

          if not tv_data:
              raise Exception("TradingView USDT pariteleri alınamadı.")

          # ============================================================
          # 3 — SADECE TOP 200 MARKET CAP COINLERİNİ EŞLEŞTİR
          # ============================================================

          matched = {}

          for row in tv_data:
              ticker_full = row.get("s", "")
              values = row.get("d", [])

              if not ticker_full or len(values) < 3:
                  continue

              # Örn:
              # BINANCE:BTCUSDT
              # BYBIT:ETHUSDT
              # OKX:SOLUSDT

              pair = ticker_full.split(":")[-1].upper()

              if not pair.endswith("USDT"):
                  continue

              base = pair[:-4]

              if base not in allowed_symbols:
                  continue

              volume = values[2]

              if volume is None:
                  continue

              try:
                  volume = float(volume)
              except:
                  continue

              # Aynı coin birden fazla borsada varsa
              # TradingView'daki en likit USDT paritesini seç.
              if (
                  base not in matched
                  or volume > matched[base]["volume"]
              ):
                  matched[base] = {
                      "ticker": ticker_full,
                      "base": base,
                      "volume": volume
                  }

          # Market-cap sırasını koru
          selected = []

          for coin in top_coins:
              sym = coin["symbol"]

              if sym in matched:
                  selected.append({
                      "symbol": sym,
                      "name": coin["name"],
                      "rank": coin["rank"],
                      "market_cap": coin["market_cap"],
                      "ticker": matched[sym]["ticker"]
                  })

          print("========================================")
          print("GERÇEK MARKET CAP TOP 200")
          print("TradingView USDT eşleşmesi:", len(selected))
          print("========================================")

          for coin in selected[:200]:
              print(
                  f"#{coin['rank']} "
                  f"{coin['name']} "
                  f"-> {coin['ticker']}"
              )

          if not selected:
              raise Exception(
                  "Top 200 market-cap coinlerinden "
                  "TradingView USDT paritesi bulunamadı."
              )

          # ============================================================
          # 4 — TRADINGVIEW 4H MACD
          # ============================================================

          tickers = [x["ticker"] for x in selected]

          macd_payload = {
              "filter": [],
              "options": {
                  "lang": "en"
              },
              "markets": [
                  "crypto"
              ],
              "symbols": {
                  "query": {
                      "types": []
                  },
                  "tickers": tickers
              },
              "columns": [
                  "name",
                  "close",

                  "MACD.macd|240",
                  "MACD.signal|240",

                  "MACD.macd[1]|240",
                  "MACD.signal[1]|240",

                  "MACD.macd[2]|240",
                  "MACD.signal[2]|240"
              ],
              "range": [
                  0,
                  300
              ]
          }

          macd_response = requests.post(
              TV_URL,
              headers=HEADERS,
              json=macd_payload,
              timeout=30
          )

          macd_response.raise_for_status()

          macd_data = macd_response.json().get("data", [])

          print("MACD verisi:", len(macd_data))

          # ============================================================
          # 5 — HISTOGRAM YÖN DEĞİŞİMİ
          #
          # h1 = son kapanmış 4H
          # h2 = önceki kapanmış 4H
          # h3 = daha önceki 4H
          #
          # KIRMIZI -> YEŞİL = AL
          # YEŞİL -> KIRMIZI = SAT
          #
          # 0 ÇİZGİSİNİ KESMEK GEREKMİYOR.
          # ============================================================

          signals = []

          for row in macd_data:

              ticker_full = row.get("s", "")
              values = row.get("d", [])

              if len(values) < 8:
                  continue

              name = values[0]
              price = values[1]

              macd0 = values[2]
              signal0 = values[3]

              macd1 = values[4]
              signal1 = values[5]

              macd2 = values[6]
              signal2 = values[7]

              nums = [
                  macd0,
                  signal0,
                  macd1,
                  signal1,
                  macd2,
                  signal2
              ]

              if any(x is None for x in nums):
                  continue

              try:
                  h1 = float(macd0) - float(signal0)
                  h2 = float(macd1) - float(signal1)
                  h3 = float(macd2) - float(signal2)
              except:
                  continue

              current_slope = h1 - h2
              previous_slope = h2 - h3

              signal = None

              # 🔴 -> 🟢
              if previous_slope <= 0 and current_slope > 0:
                  signal = "AL 🟢"

              # 🟢 -> 🔴
              elif previous_slope >= 0 and current_slope < 0:
                  signal = "SAT 🔴"

              if signal:

                  coin_symbol = ticker_full.split(":")[-1]

                  signals.append({
                      "symbol": coin_symbol,
                      "name": name,
                      "price": price,
                      "signal": signal,
                      "histogram": h1
                  })

          # ============================================================
          # 6 — TELEGRAM
          # ============================================================

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              raise Exception(
                  "TELEGRAM_BOT_TOKEN veya TELEGRAM_CHAT_ID yok."
              )

          if not signals:
              print("Yeni MACD sinyali yok.")
              exit(0)

          for s in signals:

              message = (
                  "🚨 MACD 4H ALARM 🚨\n\n"
                  f"Coin: {s['symbol']}\n"
                  "Timeframe: 4H\n"
                  f"Sinyal: {s['signal']}\n"
                  f"Fiyat: {s['price']}\n"
                  f"Histogram: {s['histogram']:.8f}\n\n"
                  "🏆 Market Cap: TOP 200"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot{token}/sendMessage"
              )

              response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": chat_id,
                      "text": message
                  },
                  timeout=20
              )

              response.raise_for_status()

              print(
                  "Telegram gönderildi:",
                  s["symbol"],
                  s["signal"]
              )

          print("========================================")
          print("TARAMA TAMAMLANDI")
          print("Sinyal:", len(signals))
          print("========================================")
          PY
