name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install requests pandas

          python - <<'PY'
          import os
          import time
          import requests
          import pandas as pd

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          COINGECKO = "https://api.coingecko.com/api/v3/coins/markets"
          COINEX_MARKETS = "https://api.coinex.com/futures/market"
          COINEX_KLINE = "https://api.coinex.com/futures/kline"

          def get_top_200():
              r = requests.get(
                  COINGECKO,
                  params={
                      "vs_currency": "usd",
                      "order": "market_cap_desc",
                      "per_page": 200,
                      "page": 1,
                      "sparkline": "false"
                  },
                  timeout=30
              )
              r.raise_for_status()

              return [
                  x["symbol"].upper()
                  for x in r.json()
                  if x.get("symbol")
              ]

          def get_markets():
              r = requests.get(
                  COINEX_MARKETS,
                  timeout=30
              )
              r.raise_for_status()

              data = r.json()

              if data.get("code") != 0:
                  raise Exception(data)

              markets = set()

              for x in data["data"]:
                  if (
                      x.get("contract_type") == "linear"
                      and x.get("quote_ccy") == "USDT"
                      and x.get("is_market_available") is True
                  ):
                      markets.add(x["market"])

              return markets

          def get_klines(market):
              r = requests.get(
                  COINEX_KLINE,
                  params={
                      "market": market,
                      "period": "4hour",
                      "limit": 100
                  },
                  timeout=30
              )
              r.raise_for_status()

              data = r.json()

              if data.get("code") != 0:
                  return None

              rows = data["data"]

              if len(rows) < 35:
                  return None

              rows = sorted(
                  rows,
                  key=lambda x: int(x["created_at"])
              )

              now = int(time.time() * 1000)

              closed = []

              for row in rows:
                  start = int(row["created_at"])
                  close = start + 4 * 60 * 60 * 1000

                  if close <= now:
                      closed.append(row)

              if len(closed) < 35:
                  return None

              return closed

          def calculate_macd(rows):
              closes = pd.Series(
                  [float(x["close"]) for x in rows],
                  dtype="float64"
              )

              ema12 = closes.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = closes.ewm(
                  span=26,
                  adjust=False
              ).mean()

              macd = ema12 - ema26

              signal = macd.ewm(
                  span=9,
                  adjust=False
              ).mean()

              histogram = macd - signal

              previous = float(histogram.iloc[-2])
              current = float(histogram.iloc[-1])

              if previous <= 0 and current > 0:
                  return "AL", current

              if previous >= 0 and current < 0:
                  return "SAT", current

              return None, current

          def send_telegram(message):
              r = requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )
              r.raise_for_status()

          print("MACD 4H TARAMASI BASLIYOR")

          coins = get_top_200()
          markets = get_markets()

          print("Top 200:", len(coins))
          print("CoinEx USDT Futures:", len(markets))

          signal_count = 0

          for coin in coins:

              market = coin + "USDT"

              if market not in markets:
                  continue

              try:
                  rows = get_klines(market)

                  if rows is None:
                      continue

                  signal, histogram = calculate_macd(rows)

                  print(
                      f"{market} | "
                      f"Histogram: {histogram:.8f} | "
                      f"Sinyal: {signal}"
                  )

                  if signal is None:
                      continue

                  price = float(rows[-1]["close"])

                  emoji = "🟢" if signal == "AL" else "🔴"

                  message = (
                      "🚨 MACD 4H ALARM 🚨\n\n"
                      f"Coin: {market}\n"
                      "Timeframe: 4H\n"
                      f"Sinyal: {signal} {emoji}\n"
                      f"Fiyat: {price}\n"
                      f"MACD Histogram: {histogram:.8f}\n\n"
                      "CoinEx Linear Futures"
                  )

                  send_telegram(message)

                  print(
                      f"TELEGRAM GONDERILDI: {market} {signal}"
                  )

                  signal_count += 1

              except Exception as e:
                  print(f"{market} HATA: {e}")

          print("================================")
          print("TARAMA TAMAMLANDI")
          print("Yeni sinyal:", signal_count)
          print("================================")
          PY
