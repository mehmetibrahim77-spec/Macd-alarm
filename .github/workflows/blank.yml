name: MACD Top 100 - 4H

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: MACD 4H Top 100
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -m pip install --user requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          BASE = "https://data-api.binance.vision"
          INTERVAL = "4h"

          print("================================")
          print("MACD TOP 100 - 4H")
          print("================================")

          # Binance'teki tüm işlem çiftlerini al
          info = requests.get(
              f"{BASE}/api/v3/exchangeInfo",
              timeout=30
          )

          info.raise_for_status()
          symbols = info.json()["symbols"]

          # Sadece aktif USDT spot pariteleri
          usdt_symbols = []

          for s in symbols:
              if (
                  s["status"] == "TRADING"
                  and s["quoteAsset"] == "USDT"
                  and s.get("isSpotTradingAllowed", False)
              ):
                  usdt_symbols.append(s["symbol"])

          print("Binance USDT pariteleri:", len(usdt_symbols))

          # Piyasa değerine göre sıralama için
          # Binance 24 saatlik ticker verilerini alıyoruz.
          ticker_response = requests.get(
              f"{BASE}/api/v3/ticker/24hr",
              timeout=30
          )

          ticker_response.raise_for_status()
          tickers = ticker_response.json()

          ticker_map = {
              x["symbol"]: x
              for x in tickers
              if x["symbol"] in usdt_symbols
          }

          # USDT hacmine göre en büyük 100 Binance paritesini seç
          # Not: Bu CoinMarketCap market-cap Top 100 değildir.
          ranked = []

          for symbol in usdt_symbols:

              if symbol not in ticker_map:
                  continue

              try:
                  volume = float(
                      ticker_map[symbol]["quoteVolume"]
                  )

                  ranked.append(
                      (symbol, volume)
                  )

              except:
                  continue

          ranked.sort(
              key=lambda x: x[1],
              reverse=True
          )

          coins = [
              x[0]
              for x in ranked[:100]
          ]

          print("Taranacak coin sayısı:", len(coins))
          print(coins)

          # ==========================================
          # COİNLERİ TEK TEK TARA
          # ==========================================

          for SYMBOL in coins:

              try:

                  print()
                  print("--------------------------------")
                  print("COIN:", SYMBOL)
                  print("--------------------------------")

                  response = requests.get(
                      f"{BASE}/api/v3/klines",
                      params={
                          "symbol": SYMBOL,
                          "interval": INTERVAL,
                          "limit": 200
                      },
                      timeout=20
                  )

                  if response.status_code != 200:
                      print(
                          "Kline hatası:",
                          response.status_code
                      )
                      continue

                  data = response.json()

                  if len(data) < 50:
                      print("Yeterli veri yok.")
                      continue

                  df = pd.DataFrame(data)

                  # Kapanış fiyatı
                  df["close"] = pd.to_numeric(df[4])

                  # Açık olan son 4H mumunu kullanma
                  df = df.iloc[:-1].copy()

                  # MACD 12 / 26
                  ema12 = df["close"].ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = df["close"].ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  # Signal 9
                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  previous_macd = macd.iloc[-2]
                  current_macd = macd.iloc[-1]

                  previous_signal = signal.iloc[-2]
                  current_signal = signal.iloc[-1]

                  price = float(
                      df["close"].iloc[-1]
                  )

                  # AL
                  buy = (
                      previous_macd <= previous_signal
                      and current_macd > current_signal
                  )

                  # SAT
                  sell = (
                      previous_macd >= previous_signal
                      and current_macd < current_signal
                  )

                  if buy:

                      action = "AL 🟢"

                  elif sell:

                      action = "SAT 🔴"

                  else:

                      print("Sinyal yok.")
                      continue

                  message = (
                      "🚨 MACD 4H ALARM 🚨\n\n"
                      f"Coin: {SYMBOL}\n"
                      "Timeframe: 4H\n"
                      f"Sinyal: {action}\n"
                      f"Fiyat: {price:.8f}\n"
                      f"MACD: {current_macd:.8f}\n"
                      f"Signal: {current_signal:.8f}"
                  )

                  print(message)

                  token = os.environ.get(
                      "TELEGRAM_BOT_TOKEN"
                  )

                  chat_id = os.environ.get(
                      "TELEGRAM_CHAT_ID"
                  )

                  if not token or not chat_id:

                      print(
                          "Telegram secret bulunamadı."
                      )

                      continue

                  telegram_url = (
                      "https://api.telegram.org/bot"
                      f"{token}/sendMessage"
                  )

                  telegram_response = requests.post(
                      telegram_url,
                      data={
                          "chat_id": chat_id,
                          "text": message
                      },
                      timeout=20
                  )

                  print(
                      "Telegram HTTP:",
                      telegram_response.status_code
                  )

              except Exception as e:

                  print(
                      f"{SYMBOL} hata verdi: {e}"
                  )

                  continue

          print()
          print("================================")
          print("TOP 100 TARAMASI TAMAMLANDI")
          print("================================")

          PY
