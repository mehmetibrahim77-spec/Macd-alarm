name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0"})

          def telegram(text):
              r = s.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  data={
                      "chat_id": CHAT_ID,
                      "text": text
                  },
                  timeout=20
              )

              print("TELEGRAM:", r.status_code)
              print(r.text)

              r.raise_for_status()

              if not r.json().get("ok"):
                  raise RuntimeError(r.text)

          def get(url, params):
              r = s.get(url, params=params, timeout=20)
              r.raise_for_status()
              return r.json()

          def binance(symbol):
              try:
                  data = get(
                      "https://api.binance.com/api/v3/klines",
                      {
                          "symbol": symbol,
                          "interval": "4h",
                          "limit": 100
                      }
                  )

                  if len(data) < 40:
                      return None

                  return [float(x[4]) for x in data[:-1]]
              except:
                  return None

          def bybit(symbol):
              try:
                  data = get(
                      "https://api.bybit.com/v5/market/kline",
                      {
                          "category": "linear",
                          "symbol": symbol,
                          "interval": "240",
                          "limit": 100
                      }
                  )

                  if data.get("retCode") != 0:
                      return None

                  rows = data["result"]["list"]

                  if len(rows) < 40:
                      return None

                  rows.sort(key=lambda x: int(x[0]))

                  return [float(x[4]) for x in rows[:-1]]
              except:
                  return None

          def okx(symbol):
              try:
                  base = symbol[:-4]

                  data = get(
                      "https://www.okx.com/api/v5/market/candles",
                      {
                          "instId": f"{base}-USDT-SWAP",
                          "bar": "4H",
                          "limit": "100"
                      }
                  )

                  if data.get("code") != "0":
                      return None

                  rows = data.get("data", [])

                  if len(rows) < 40:
                      return None

                  rows.sort(key=lambda x: int(x[0]))

                  return [float(x[4]) for x in rows[:-1]]
              except:
                  return None

          def gate(symbol):
              try:
                  base = symbol[:-4]

                  data = get(
                      "https://api.gateio.ws/api/v4/futures/usdt/candlesticks",
                      {
                          "contract": f"{base}_USDT",
                          "interval": "4h",
                          "limit": 100
                      }
                  )

                  if len(data) < 40:
                      return None

                  data.sort(key=lambda x: int(x["t"]))

                  return [float(x["c"]) for x in data[:-1]]
              except:
                  return None

          def prices(symbol):
              for name, func in [
                  ("BINANCE", binance),
                  ("BYBIT", bybit),
                  ("OKX", okx),
                  ("GATE", gate)
              ]:
                  p = func(symbol)

                  if p:
                      return name, p

              return None, None

