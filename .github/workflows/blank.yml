name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Top 200 - 4H MACD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          BASE = "https://api.bybit.com"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def bybit_get(endpoint, params):
              r = session.get(
                  BASE + endpoint,
                  params=params,
                  timeout=20
              )
              print(f"{endpoint} -> {r.status_code}")
              r.raise_for_status()

              data = r.json()

              if data.get("retCode") != 0:
                  raise RuntimeError(f"Bybit: {data}")

              return data["result"]

          def telegram(message):
              url = (
                  f"https://api.telegram.org/"
                  f"bot{TOKEN}/sendMessage"
              )

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram:", r.status_code)

          # ==========================================
          # TOP 200 USDT PERPETUAL
          # ==========================================

          result = bybit_get(
              "/v5/market/tickers",
              {
                  "category": "linear"
              }
          )

          tickers = result["list"]

          coins = []

          for item in tickers:
              symbol = item.get("symbol", "")

              if not symbol.endswith("USDT"):
                  continue

              # Sadece perpetual kontratlar
              if item.get("contractType") != "LinearPerpetual":
                  continue

              try:
                  turnover = float(item["turnover24h"])
              except:
                  continue

              coins.append((symbol, turnover))

          # 24 saatlik işlem hacmine göre sırala
          coins.sort(
              key=lambda x: x[1],
              reverse=True
          )

          symbols = [
              x[0]
              for x in coins[:200]
          ]

          print(
              f"TOP 200 bulundu: {len(symbols)}"
          )

          # ==========================================
          # 4H MACD 12 / 26 / 9
          # ==========================================

          for symbol in symbols:

              try:

                  result = bybit_get(
                      "/v5/market/kline",
                      {
                          "category": "linear",
                          "symbol": symbol,
                          "interval": "240",
                          "limit": "100"
                      }
                  )

                  rows = result["list"]

                  if len(rows) < 40:
                      continue

                  # En yeni mum ilk sırada gelir
                  rows = sorted(
                      rows,
                      key=lambda x: int(x[0])
                  )

                  # Açık 4H mumunu kullanma
                  closed = rows[:-1]

                  closes = pd.Series([
                      float(row[4])
                      for row in closed
                  ])

                  if len(closes) < 35:
                      continue

                  # ==========================
                  # MACD 12 / 26 / 9
                  # ==========================

                  ema12 = closes.ewm(
                      span=12,
                      adjust=False
                  ).mean()

                  ema26 = closes.ewm(
                      span=26,
                      adjust=False
                  ).mean()

                  macd = ema12 - ema26

                  signal = macd.ewm(
                      span=9,
                      adjust=False
                  ).mean()

                  histogram = macd - signal

                  # Son iki kapanmış mum
                  previous_hist = histogram.iloc[-2]
                  current_hist = histogram.iloc[-1]

                  price = float(closes.iloc[-1])

                  # =================================
                  # KIRMIZIDAN YEŞİLE -> AL
                  # =================================

                  buy_signal = (
                      previous_hist <= 0
                      and current_hist > 0
                  )

                  # =================================
                  # YEŞİLDEN KIRMIZIYA -> SAT
                  # =================================

                  sell_signal = (
                      previous_hist >= 0
                      and current_hist < 0
                  )

                  if buy_signal:

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          "Sinyal: AL 🟢\n"
                          f"Fiyat: {price}\n\n"
                          "MACD kırmızıdan yeşile döndü."
                      )

                      telegram(message)

                      print(message)

                  elif sell_signal:

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          "Sinyal: SAT 🔴\n"
                          f"Fiyat: {price}\n\n"
                          "MACD yeşilden kırmızıya döndü."
                      )

                      telegram(message)

                      print(message)

                  else:
                      print(
                          f"{symbol}: Sinyal yok"
                      )

              except Exception as e:

                  print(
                      f"{symbol}: HATA -> {e}"
                  )

          print("Tarama tamamlandı.")
          PY
