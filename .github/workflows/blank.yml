name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: TradingView Top 100 - 4H MACD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          pip install requests pandas

          python - <<'PY'
          import os
          import requests
          import pandas as pd

          TV_URL = "https://scanner.tradingview.com/crypto/scan"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          # TradingView'dan büyük CEX USDT çiftlerini al
          exchanges = [
              "BINANCE",
              "BYBIT",
              "OKX",
              "BITGET",
              "COINBASE"
          ]

          symbols = []

          # ==========================================
          # TOP 100 KRİPTO
          # Hacme göre TradingView'dan
          # ==========================================

          payload = {
              "filter": [
                  {
                      "left": "name",
                      "operation": "match",
                      "right": ".*USDT$"
                  }
              ],
              "options": {
                  "lang": "en"
              },
              "markets": [
                  "crypto"
              ],
              "symbols": {
                  "query": {
                      "types": []
                  },
                  "tickers": []
              },
              "columns": [
                  "name",
                  "close",
                  "volume",
                  "change"
              ],
              "sort": {
                  "sortBy": "volume",
                  "sortOrder": "desc"
              },
              "range": [
                  0,
                  300
              ]
          }

          r = requests.post(
              TV_URL,
              json=payload,
              timeout=30
          )

          print("TradingView:", r.status_code)

          r.raise_for_status()

          data = r.json()

          rows = data.get("data", [])

          print(
              "TradingView sonuç:",
              len(rows)
          )

          # Sadece gerçek USDT çiftleri
          for row in rows:

              ticker = row.get("s", "")

              if not ticker:
                  continue

              if not ticker.endswith("USDT"):
                  continue

              # Aynı coin'in farklı borsalardaki
              # tekrarlarını engelle
              base = ticker.split(":")[-1]

              if base not in [
                  x.split(":")[-1]
                  for x in symbols
              ]:
                  symbols.append(ticker)

              if len(symbols) >= 100:
                  break

          print(
              f"TOP 100 bulundu: {len(symbols)}"
          )

          # ==========================================
          # MACD
          # ==========================================

          # TradingView scanner'dan doğrudan
          # 4H MACD değerlerini alacağız.
          #
          # MACD.macd|240
          # MACD.signal|240
          #
          # Histogram = MACD - Signal
          #
          # Önceki ve mevcut kapanmış mum için
          # değerleri alıyoruz.

          selected = symbols[:100]

          # TradingView tek istekte çok sayıda sembol
          # kabul ediyor.
          payload = {
              "symbols": {
                  "tickers": selected,
                  "query": {
                      "types": []
                  }
              },
              "columns": [
                  "name",
                  "close",
                  "MACD.macd|240",
                  "MACD.signal|240",
                  "MACD.macd[1]|240",
                  "MACD.signal[1]|240"
              ]
          }

          r = requests.post(
              TV_URL,
              json=payload,
              timeout=30
          )

          print(
              "MACD TradingView:",
              r.status_code
          )

          r.raise_for_status()

          result = r.json()

          macd_rows = result.get(
              "data",
              []
          )

          print(
              "MACD sonucu:",
              len(macd_rows)
          )

          # ==========================================
          # AL / SAT
          # ==========================================

          for row in macd_rows:

              try:

                  symbol = row["s"]

                  values = row["d"]

                  # Alan sırası:
                  # name
                  # close
                  # MACD current
                  # signal current
                  # MACD previous
                  # signal previous

                  price = values[1]

                  macd_current = values[2]
                  signal_current = values[3]

                  macd_previous = values[4]
                  signal_previous = values[5]

                  if any(
                      x is None
                      for x in [
                          macd_current,
                          signal_current,
                          macd_previous,
                          signal_previous
                      ]
                  ):
                      continue

                  # Histogram
                  current_hist = (
                      macd_current -
                      signal_current
                  )

                  previous_hist = (
                      macd_previous -
                      signal_previous
                  )

                  # =================================
                  # 🔴 -> 🟢
                  # =================================

                  if (
                      previous_hist <= 0
                      and current_hist > 0
                  ):

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          "Sinyal: AL 🟢\n"
                          f"Fiyat: {price}\n\n"
                          f"Histogram: "
                          f"{previous_hist:.8f} → "
                          f"{current_hist:.8f}"
                      )

                      print(message)

                      requests.post(
                          f"https://api.telegram.org/"
                          f"bot{TOKEN}/sendMessage",
                          data={
                              "chat_id": CHAT_ID,
                              "text": message
                          },
                          timeout=20
                      )

                  # =================================
                  # 🟢 -> 🔴
                  # =================================

                  elif (
                      previous_hist >= 0
                      and current_hist < 0
                  ):

                      message = (
                          "🚨 MACD 4H ALARM 🚨\n\n"
                          f"Coin: {symbol}\n"
                          "Timeframe: 4H\n"
                          "Sinyal: SAT 🔴\n"
                          f"Fiyat: {price}\n\n"
                          f"Histogram: "
                          f"{previous_hist:.8f} → "
                          f"{current_hist:.8f}"
                      )

                      print(message)

                      requests.post(
                          f"https://api.telegram.org/"
                          f"bot{TOKEN}/sendMessage",
                          data={
                              "chat_id": CHAT_ID,
                              "text": message
                          },
                          timeout=20
                      )

              except Exception as e:

                  print(
                      "Coin hata:",
                      type(e).__name__,
                      e
                  )

          print(
              "✅ TOP 100 4H MACD TARAMASI TAMAMLANDI"
          )

          PY
