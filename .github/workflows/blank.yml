name: MACD Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"

permissions:
  contents: read

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MACD Top 200 - 4H
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

          python <<'PY'
          import os
          import time
          import requests
          import pandas as pd
          from datetime import datetime, timezone

          BINANCE = "https://fapi.binance.com"
          COINGECKO = "https://api.coingecko.com/api/v3"

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          if not TOKEN:
              raise RuntimeError("TELEGRAM_BOT_TOKEN secret bulunamadı.")

          if not CHAT_ID:
              raise RuntimeError("TELEGRAM_CHAT_ID secret bulunamadı.")

          session = requests.Session()

          session.headers.update({
              "User-Agent": "MACD-Alarm/2.0",
              "Accept": "application/json"
          })

          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              r = session.post(
                  url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram HTTP:", r.status_code)
              print("Telegram cevap:", r.text[:500])

              r.raise_for_status()

              data = r.json()

              if not data.get("ok"):
                  raise RuntimeError(f"Telegram API hatası: {data}")

          # ============================================================
          # COINGECKO TOP 200
          # ============================================================

          def get_top_200():

              url = f"{COINGECKO}/coins/markets"

              params = {
                  "vs_currency": "usd",
                  "order": "market_cap_desc",
                  "per_page": 200,
                  "page": 1,
                  "sparkline": "false"
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=30
              )

              print("CoinGecko HTTP:", r.status_code)

              r.raise_for_status()

              data = r.json()

              if not isinstance(data, list):
                  raise RuntimeError("CoinGecko beklenmeyen cevap verdi.")

              print("Top 200 coin alındı:", len(data))

              return data

          # ============================================================
          # BINANCE SYMBOLS
          # ============================================================

          def get_binance_symbols():

              url = f"{BINANCE}/fapi/v1/exchangeInfo"

              r = session.get(
                  url,
                  timeout=30
              )

              print("Binance exchangeInfo HTTP:", r.status_code)

              r.raise_for_status()

              data = r.json()

              symbols = {}

              for item in data.get("symbols", []):

                  symbol = item.get("symbol", "")
                  status = item.get("status", "")
                  contract_type = item.get("contractType", "")
                  quote_asset = item.get("quoteAsset", "")
                  base_asset = item.get("baseAsset", "")

                  if (
                      status == "TRADING"
                      and contract_type == "PERPETUAL"
                      and quote_asset == "USDT"
                      and base_asset
                  ):
                      symbols[base_asset.upper()] = symbol

              print(
                  "Binance USDT perpetual sayısı:",
                  len(symbols)
              )

              return symbols

          # ============================================================
          # 4H KLINES
          # ============================================================

          def get_klines(symbol):

              url = f"{BINANCE}/fapi/v1/klines"

              params = {
                  "symbol": symbol,
                  "interval": "4h",
                  "limit": 100
              }

              r = session.get(
                  url,
                  params=params,
                  timeout=20
              )

              if not r.ok:
                  print(
                      f"{symbol}: HTTP {r.status_code}"
                  )
                  return None

              rows = r.json()

              if not isinstance(rows, list):
                  return None

              if len(rows) < 40:
                  return None

              # ========================================================
              # SON MUM AÇIK OLABİLİR.
              # Sadece kapanmış mumları kullanıyoruz.
              # ========================================================

              now_ms = int(time.time() * 1000)

              closed_rows = [
                  row for row in rows
                  if int(row[6]) <= now_ms
              ]

              if len(closed_rows) < 40:
                  return None

              closes = [
                  float(row[4])
                  for row in closed_rows
              ]

              close_times = [
                  int(row[6])
                  for row in closed_rows
              ]

              return closes, close_times

          # ============================================================
          # MACD
          # ============================================================

          def calculate_macd(closes):

              series = pd.Series(closes, dtype="float64")

              ema12 = series.ewm(
                  span=12,
                  adjust=False
              ).mean()

              ema26 = series.ewm(
                  span=26,
                  adjust=False
              ).mean()

              macd = ema12 - ema26

              signal = macd.ewm(
                  span=9,
                  adjust=False
              ).mean()

              histogram = macd - signal

              return macd, signal, histogram

          # ============================================================
          # TOP 200 + BINANCE
          # ============================================================

          top_200 = get_top_200()

          binance_symbols = get_binance_symbols()

          results = []

          checked = 0
          skipped = 0

          for rank, coin in enumerate(top_200, start=1):

              base = coin.get("symbol", "").upper()

              if not base:
                  skipped += 1
                  continue

              symbol = binance_symbols.get(base)

              if not symbol:
                  skipped += 1
                  continue

              try:

                  data = get_klines(symbol)

                  if data is None:
                      skipped += 1
                      continue

                  closes, close_times = data

                  macd, signal, histogram = calculate_macd(
                      closes
                  )

                  # ----------------------------------------------------
                  # SON İKİ KAPANMIŞ MUM
                  # ----------------------------------------------------

                  previous_hist = float(histogram.iloc[-2])
                  current_hist = float(histogram.iloc[-1])

                  price = float(closes[-1])

                  candle_close_ms = close_times[-1]

                  candle_close = datetime.fromtimestamp(
                      candle_close_ms / 1000,
                      tz=timezone.utc
                  )

                  # ----------------------------------------------------
                  # KIRMIZI -> YEŞİL = AL
                  # ----------------------------------------------------

                  if (
                      previous_hist <= 0
                      and current_hist > 0
                  ):

                      results.append({
                          "rank": rank,
                          "symbol": symbol,
                          "signal": "AL",
                          "price": price,
                          "hist": current_hist,
                          "candle_close": candle_close
                      })

                  # ----------------------------------------------------
                  # YEŞİL -> KIRMIZI = SAT
                  # ----------------------------------------------------

                  elif (
                      previous_hist >= 0
                      and current_hist < 0
                  ):

                      results.append({
                          "rank": rank,
                          "symbol": symbol,
                          "signal": "SAT",
                          "price": price,
                          "hist": current_hist,
                          "candle_close": candle_close
                      })

                  checked += 1

                  print(
                      f"[{rank}/200] {symbol} "
                      f"MACD histogram: "
                      f"{previous_hist:.8f} -> "
                      f"{current_hist:.8f}"
                  )

              except Exception as e:

                  skipped += 1

                  print(
                      f"{symbol} hata: {e}"
                  )

              # Binance rate limitini gereksiz zorlamayalım.
              time.sleep(0.05)

          # ============================================================
          # SONUÇ
          # ============================================================

          print("")
          print("================================")
          print("TARAMA TAMAMLANDI")
          print("Kontrol edilen:", checked)
          print("Atlanan:", skipped)
          print("Sinyal:", len(results))
          print("================================")

          # ============================================================
          # TELEGRAM
          # ============================================================

          if results:

              for item in results:

                  emoji = "🟢" if item["signal"] == "AL" else "🔴"

                  message = (
                      f"🚨 MACD 4H ALARM 🚨\n\n"
                      f"Coin: {item['symbol']}\n"
                      f"Timeframe: 4H\n"
                      f"Sinyal: {item['signal']} {emoji}\n"
                      f"Fiyat: {item['price']}\n"
                      f"MACD Histogram: {item['hist']:.8f}\n"
                      f"Top 200 Sırası: #{item['rank']}\n"
                      f"Mum kapanışı: "
                      f"{item['candle_close'].strftime('%Y-%m-%d %H:%M UTC')}"
                  )

                  send_telegram(message)

          else:

              print(
                  "Yeni MACD AL/SAT sinyali yok."
              )

          print("İşlem tamamlandı.")
          PY
